[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unusual-whales"
version = "0.1.2"
description = "Unusual Whales' options flow and market data, from its public API, into an Open Meridian deployment's lake: a data plugin"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
# The SDK and nothing else, pinned exactly: the sidecar this runs beside
# speaks one version of the contract (v28), and a range would let a rebuild
# pick up another. The Dockerfile's base is the same version. The API is
# reached with the standard library's HTTP client: no third-party dependency.
dependencies = [
  "open-meridian==0.33.4",
]

[project.urls]
Repository = "https://github.com/open-meridian/plugin-unusual-whales"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "mypy>=1.11",
  "ruff>=0.6",
]

[project.scripts]
unusual-whales = "unusual_whales.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# The pages' templates and the sample data -- made-up option contracts and
# prints in the API's documented shape -- installed beside the
# code that reads them.
[tool.setuptools.package-data]
unusual_whales = ["templates/*.html", "synthetic/*.json"]

# What this plugin says about itself, which `meridian plugin upload` sends and
# a deployment admin approves before it runs (W8). Declarations, not grants.
[tool.meridian]
# Roles from the deployment's fixed list, fifteen -- compliance, confirmation, connectivity,
# custody, data, ems, oms, operations, portfolio, pricing, reference, reporting, servicing,
# settlement, signal -- and its grants are theirs. `data`, a data plugin: it
# records Unusual Whales' values into the lake and answers the lake's wants, W10's steps.
roles = ["data"]
# Whether it serves a page through its sidecar.
interface = true
# Its declaration: its settings, the catalogue of datasets it serves the lake
# (contract v18), its storage, its pages and tools, and its documentation in
# docs/. Upload reads it from the built image with `meridian-declaration`.
declaration = "unusual_whales.declaration:DECLARATION"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["unusual_whales"]
known-local-folder = ["conftest"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

# The SDK's gRPC stubs have no types (meridian-python's own configuration
# says the same).
[[tool.mypy.overrides]]
module = [
    "meridian.v1.sidecar_pb2_grpc",
    "meridian.v1.envelope_pb2_grpc",
    "meridian.plugin.v1.operations_pb2_grpc",
]
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
